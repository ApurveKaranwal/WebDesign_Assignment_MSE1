<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - WanderLust</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <h2>Welcome Back</h2>
            <p>Sign in to plan your next adventure.</p>
            
            <form onsubmit="return loginUser(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="admin" />
                    <small id="username-error" style="color: red; display: none; margin-top: 5px;">Error message here.</small>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="123456" />
                    <small id="password-error" style="color: red; display: none; margin-top: 5px;">Error message here.</small>
                </div>

                <button type="submit" class="btn-login">Login</button>
                
                <p class="signup-link">Don't have an account? <a href="#">Sign Up</a></p>
            </form>
        </div>
    </div>

    <script>
        function loginUser(event) {
            // 1. Prevent form submission
            event.preventDefault();

            // 2. Get elements and values
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const userVal = usernameInput.value.trim(); // trim() removes whitespace
            const passVal = passwordInput.value;

            // Get error message elements
            const userError = document.getElementById('username-error');
            const passError = document.getElementById('password-error');

            // 3. Reset previous errors (hide them initially)
            userError.style.display = 'none';
            passError.style.display = 'none';
            
            let isValid = true;

            // --- VALIDATION LOGIC ---

            // A. Username Validation
            if (userVal === "") {
                userError.textContent = "Username cannot be empty.";
                userError.style.display = 'block';
                isValid = false;
            } else if (userVal.length < 3) {
                userError.textContent = "Username must be at least 3 characters.";
                userError.style.display = 'block';
                isValid = false;
            }

            // B. Password Validation
            // Logic: Must be 6+ chars AND contain at least one number
            const hasNumber = /\d/; // Regular expression to check for a digit

            if (passVal.length < 6) {
                passError.textContent = "Password must be at least 6 characters.";
                passError.style.display = 'block';
                isValid = false;
            } else if (!hasNumber.test(passVal)) {
                passError.textContent = "Password must contain at least one number.";
                passError.style.display = 'block';
                isValid = false;
            }

            // 4. Final Decision
            if (isValid) {
                alert("Login Successful! Welcome, " + userVal);
                window.location.href = "home.html";
                return true;
            } else {
                return false;
            }
        }
    </script>

</body>
</html>
