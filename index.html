<!DOCTYPE html>
<html>
<head>
    <title>Login - VoyageVista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <br><br><br>

    <center>
        <div style="border: 1px solid #ccc; width: 350px; padding: 30px; background-color: white; border-radius: 10px;">
            <h2 style="color: #008080;">Welcome Back</h2>
            <p>Sign in to plan your next adventure.</p>
            
            <hr>
            <br>

            <form onsubmit="return validateLogin()">
                
                <div style="text-align: left;">
                    <label><strong>Email Address:</strong></label><br>
                    <input type="email" id="email" placeholder="example@email.com" style="width: 93%; padding: 8px; margin-top: 5px;">
                </div>
                
                <br>

                <div style="text-align: left;">
                    <label><strong>Password:</strong></label><br>
                    <input type="password" id="password" placeholder="Enter password" style="width: 93%; padding: 8px; margin-top: 5px;">
                </div>

                <br><br>

                <button type="submit" class="btn-book" style="width: 100%; cursor: pointer; font-size: 16px;">Login</button>
                
                <br><br>
                
                <p style="font-size: 12px;">Don't have an account? <a href="#" style="color: blue;">Sign Up</a></p>
            </form>
        </div>
    </center>

    <br><br>

    <div class="footer">
        <p>VoyageVista Travel Agency &copy; 2025. All rights reserved.</p>
    </div>

    <script>
        function validateLogin() {
            // Get values from inputs
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;

            // 1. Check if email is empty
            if (email == "") {
                alert("Please enter your email address.");
                return false; // Stops the form from submitting
            }

            // 2. Check if password is empty
            if (password == "") {
                alert("Please enter your password.");
                return false;
            }

            // 3. Very basic password check (Student level logic)
            if (password.length < 5) {
                alert("Password must be at least 5 characters long.");
                return false;
            }

            // If everything is okay
            alert("Login Successful! Welcome " + email);
            window.location.href = "home.html"; // Redirect to home
            return false; // We return false here just to prevent the actual form submit refresh for the demo
        }
    </script>

</body>
</html>
