<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - WanderLust</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>


    <div class="login-wrapper">
        <div class="login-container">
            <h2>Welcome Back</h2>
            <p>Sign in to plan your next adventure.</p>
            
            <form onsubmit="return loginUser(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="admin" required />
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="123456" required />
                    <small id="error-msg" style="color: red; display: none;">Password must be at least 6 characters.</small>
                </div>

                <button type="submit" class="btn-login">Login</button>
                
                <p class="signup-link">Don't have an account? <a href="#">Sign Up</a></p>
            </form>
        </div>
    </div>

    <script>
        function loginUser(event) {
            // 1. Prevent the form from refreshing the page immediately
            event.preventDefault();

            // 2. Get the values
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // 3. Validation Logic
            if (pass.length < 6) {
                // Show error if password is too short
                errorMsg.style.display = 'block';
                return false;
            } else {
                // Hide error if valid
                errorMsg.style.display = 'none';
                
                // 4. Success Alert
                alert("Login Successful! Welcome, " + user);

                // 5. Redirect to Home Page (index.html is the standard name for home)
                window.location.href = "home.html"; 
                return true;
            }
        }
    </script>

</body>
</html>
