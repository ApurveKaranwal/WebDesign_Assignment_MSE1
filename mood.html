<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mood Planner - Horizon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Voyage<span class="highlight">Vista</span>.</h1>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="pakages.html">Destinations</a></li>
                <li><a href="mood.html">Mood Planner</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="btn-nav">Book Now</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header" style="height: 40vh; background-image: url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-overlay">
            <div class="hero-content">
                <h2>How are you feeling?</h2>
                <p>Select your current mood and let us decide the destination.</p>
            </div>
        </div>
    </header>

    <section class="container" style="padding: 50px 0; text-align: center;">
        
        <div class="mood-buttons">
            <button onclick="showDestinations('stressed')" class="btn-mood stressed">
                <i class="fas fa-spa"></i> Stressed
            </button>
            <button onclick="showDestinations('bored')" class="btn-mood bored">
                <i class="fas fa-bolt"></i> Bored
            </button>
            <button onclick="showDestinations('heartbroken')" class="btn-mood broken">
                <i class="fas fa-heart-broken"></i> Heartbroken
            </button>
        </div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

        <div id="results-area">
            <h3 style="color: #777;">Select a mood above to see your perfect trip.</h3>
        </div>

    </section>

    <footer>
        <div class="container">
            <p>VoyageVista Travel Agency &copy; 2025. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function showDestinations(mood) {
            const results = document.getElementById('results-area');
            let content = "";

            if (mood === 'stressed') {
                content = `
                    <h2 class="section-title">Peaceful Getaways 🌿</h2>
                    <div class="grid-3">
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Maldives Resort</h3>
                                <p>Disconnect from the noise. No phones, just ocean.</p>
                                <span class="price">$2,000</span>
                                <a href="contact.html" class="btn-card">Book Peace</a>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Swiss Alps Spa</h3>
                                <p>Fresh air, hot springs, and complete silence.</p>
                                <span class="price">$1,800</span>
                                <a href="contact.html" class="btn-card">Book Peace</a>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1528747045269-390fe33c19f2?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Kyoto Zen Garden</h3>
                                <p>Meditate in ancient temples.</p>
                                <span class="price">$1,400</span>
                                <a href="contact.html" class="btn-card">Book Peace</a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (mood === 'bored') {
                content = `
                    <h2 class="section-title">Adventure Time ⚡</h2>
                    <div class="grid-3">
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1521336575822-6da63fb45455?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>New Zealand Bungee</h3>
                                <p>Adrenaline rush in the adventure capital of the world.</p>
                                <span class="price">$1,600</span>
                                <a href="contact.html" class="btn-card">Book Adventure</a>
                            </div>
                        </div>
                        
                         <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1519904981063-b0cf448d479e?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Amazon Jungle Trek</h3>
                                <p>Explore the wild unknown.</p>
                                <span class="price">$1,300</span>
                                <a href="contact.html" class="btn-card">Book Adventure</a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (mood === 'heartbroken') {
                content = `
                    <h2 class="section-title">Healing Journeys ❤️‍🩹</h2>
                    <div class="grid-3">
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Solo Trek in Peru</h3>
                                <p>Find yourself on the path to Machu Picchu.</p>
                                <span class="price">$1,500</span>
                                <a href="contact.html" class="btn-card">Start Healing</a>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Beach Yoga, Thailand</h3>
                                <p>New friends, healthy food, and golden sunsets.</p>
                                <span class="price">$900</span>
                                <a href="contact.html" class="btn-card">Start Healing</a>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1488085061387-422e29b40080?auto=format&fit=crop&w=800&q=80');"></div>
                            <div class="card-text">
                                <h3>Iceland Road Trip</h3>
                                <p>Just you and the open road under the Northern Lights.</p>
                                <span class="price">$2,100</span>
                                <a href="contact.html" class="btn-card">Start Healing</a>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Inject the content into the page
            results.innerHTML = content;
        }
    </script>

</body>
</html>
